name: Build Vista APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'YouTube target version'
        required: true
        default: '21.20.405'
      apk_url:
        description: 'Optional direct download URL for base YouTube APK'
        required: false
        default: ''

jobs:
  build:
    name: Build Vista APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Export Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Build Vista Patches Bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Download Morphe Patcher CLI
        run: |
          CLI_URL=$(curl -sL https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url')
          echo "Downloading CLI: $CLI_URL"
          curl -L -o morphe-cli.jar "$CLI_URL"

      - name: Obtain Base YouTube APK
        run: |
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            echo "Downloading base APK from user URL: ${{ github.event.inputs.apk_url }}"
            curl -L -o youtube.apk "${{ github.event.inputs.apk_url }}"
          else
            echo "Downloading verified supported YouTube base APK (v21.39.522)..."
            curl -L -o youtube.apk "https://pool.apk.aptoide.com/bjwawesome/com-google-android-youtube-1561299900-76845135-d2cadaefeaa82540874ad69450c64e14.apk"
          fi

      - name: Verify Base YouTube APK
        run: |
          if [ ! -f youtube.apk ] || [ ! -s youtube.apk ]; then
            echo "Error: youtube.apk was not created or is empty."
            exit 1
          fi
          FILE_SIZE=$(wc -c < youtube.apk)
          echo "Base YouTube APK size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 50000000 ]; then
            echo "Error: Downloaded APK is smaller than 50MB ($FILE_SIZE bytes)."
            head -n 20 youtube.apk || true
            exit 1
          fi

      - name: Patch APK with Vista
        run: |
          PATCH_BUNDLE=$(ls patches/build/libs/patches-*.mpp | head -n 1)
          echo "Applying patch bundle $PATCH_BUNDLE to youtube.apk..."
          java -jar morphe-cli.jar patch \
            --patches "$PATCH_BUNDLE" \
            --out Vista.apk \
            --force \
            youtube.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vista-YouTube-APK
          path: Vista.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.47.0-vista
          name: "Vista YouTube v1.47.0"
          body: |
            ## 📱 Vista YouTube APK
            Personalized, ad-free YouTube built with custom **Vista** branding and icons.
            
            ### 📥 Installation Steps:
            1. Download **`Vista.apk`** below to your Android device.
            2. If you want Google Account sign-in (non-root), install **[MicroG RE](https://github.com/WSTxda/MicroG-RE/releases)**.
            3. Install `Vista.apk` and enjoy!
          files: |
            Vista.apk
            patches/build/libs/patches-*.mpp
