name: Build Vista APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'YouTube target version (e.g. 21.39.522 or 21.20.405)'
        required: true
        default: '21.39.522'
      apk_url:
        description: 'Optional direct download URL for base YouTube APK'
        required: false
        default: ''

jobs:
  build:
    name: Build Vista APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Export Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Build Vista Patches Bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Download Morphe Patcher CLI
        run: |
          CLI_URL=$(curl -sL https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url')
          echo "Downloading CLI: $CLI_URL"
          curl -L -o morphe-cli.jar "$CLI_URL"

      - name: Obtain Base YouTube APK from APKMirror
        if: ${{ !github.event.inputs.apk_url }}
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: 'google-inc'
          repo: 'youtube'
          version: ${{ github.event.inputs.version }}
          bundle: true
          filename: 'youtube.apkm'

      - name: Obtain Base YouTube APK from User URL
        if: ${{ github.event.inputs.apk_url }}
        run: |
          echo "Downloading base APK from user URL: ${{ github.event.inputs.apk_url }}"
          curl -L -o youtube.apk "${{ github.event.inputs.apk_url }}"

      - name: Verify Base YouTube APK
        run: |
          INPUT_APP=$(ls youtube.* 2>/dev/null | head -n 1 || true)
          if [ -z "$INPUT_APP" ] || [ ! -f "$INPUT_APP" ] || [ ! -s "$INPUT_APP" ]; then
            echo "Error: Base YouTube input was not found or is empty."
            exit 1
          fi
          FILE_SIZE=$(wc -c < "$INPUT_APP")
          echo "Base YouTube input ($INPUT_APP) size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 20000000 ]; then
            echo "Error: Downloaded file is smaller than 20MB ($FILE_SIZE bytes)."
            head -n 20 "$INPUT_APP" || true
            exit 1
          fi

      - name: Patch APK with Vista
        run: |
          PATCH_BUNDLE=$(ls patches/build/libs/patches-*.mpp | head -n 1)
          INPUT_APP=$(ls youtube.* 2>/dev/null | head -n 1)
          echo "Applying patch bundle $PATCH_BUNDLE to $INPUT_APP..."
          java -jar morphe-cli.jar patch \
            --patches "$PATCH_BUNDLE" \
            --out Vista.apk \
            --force \
            "$INPUT_APP"

      - name: Prepare Vista Services APK
        run: |
          echo "Downloading latest MicroG as Vista-Services.apk..."
          curl -L -o Vista-Services.apk "https://github.com/MorpheApp/MicroG-RE/releases/download/7.2.1/microg-7.2.1.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vista-YouTube-APK
          path: |
            Vista.apk
            Vista-Services.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.47.0-vista
          name: "Vista YouTube v1.47.0"
          body: |
            ## 📱 Vista YouTube & Vista Services
            Personalized, ad-free YouTube built with custom **Vista** branding and icons by Sanket Kurve.
            
            ### 📥 Installation Steps:
            1. Download and install **`Vista-Services.apk`** below (required for Google Account sign-in).
            2. Download and install **`Vista.apk`**.
            3. Open Vista and enjoy an ad-free experience!
          files: |
            Vista.apk
            Vista-Services.apk
            patches/build/libs/patches-*.mpp
